[pytest]
# Keep these in the default collection (no -m filter needed to see them listed), but they're
# marked `emulator` so a plain `pytest` from the repo root doesn't accidentally try to boot
# emulators -- run them explicitly with `pytest -m emulator qa/`.
markers =
    emulator: requires a real Android emulator (adb/AVDs); see qa/README.md

# -rs: always show skip reasons in the summary -- a silent "4 skipped" with no explanation
# (e.g. ANDROID_HOME not set, QA_MEETING_URL not set) is the single most confusing thing this
# suite can do to someone running it for the first time.
addopts = -rs
